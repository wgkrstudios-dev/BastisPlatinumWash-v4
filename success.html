<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Basti's Platinum Car Wash - Booking Confirmed</title>
    <meta name="theme-color" content="#0a0a0a">

    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;800&display=swap" rel="stylesheet">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="styles.css">
    
    <!-- Sentry CDN Script -->
    <script src="https://browser.sentry-cdn.com/7.112.2/bundle.min.js" crossorigin="anonymous"></script>
    
    <!-- Supabase JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Supabase Configuration -->
    <script src="supabase-config.js"></script>
</head>

<body>
    <!-- Background overlay details for depth -->
    <div class="glow-bg"></div>

    <div class="app-container">
        <!-- Header Section -->
        <header class="app-header">
            <div class="logo-container">
                <img src="assets/BPCW-mainlogo.png" alt="Basti's Platinum Car Wash Logo" class="main-logo">
            </div>
            <h1 class="hero-title">PREMIUM CARE. AT YOUR DOORSTEP. EVERY TIME.</h1>
        </header>

        <!-- Main Content Area -->
        <main class="app-content">
            <!-- Premium Glassmorphic Success Card -->
            <div class="modal-content">
                <div class="logo-container">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="64" height="64">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                </div>
                <div class="app-header">
                    <h2 class="modal-title">Booking Confirmed</h2>
                    <p class="modal-subtitle">Your new appointment time has been successfully locked in.</p>
                </div>
                <div id="status-container"></div>
            </div>
        </main>

        <!-- Footer Section -->
        <footer class="app-footer">
            <p>&copy; 2026 Basti's Platinum Car Wash. All rights reserved.</p>
            <p class="developer-tag">Designed by WGKR Studios</p>
        </footer>
    </div>

    <!-- Router Logic -->
    <script src="success.js"></script>
</body>

</html>
