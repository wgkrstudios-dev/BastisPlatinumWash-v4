<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Basti's Platinum Car Wash</title>
    <meta name="theme-color" content="#0a0a0a">

    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;800&display=swap" rel="stylesheet">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="home.css">

    <!-- Sentry & GSAP CDN Scripts -->
    <script src="https://browser.sentry-cdn.com/7.112.2/bundle.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js" crossorigin="anonymous"></script>

    <!-- Three.js Import Map -->
    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
    </script>
</head>

<body>
    <!-- === [STEP 1.1: DOM SHELL] === -->
    <div id="canvas-container"></div>
    <div id="ui-layer">
        <div id="intro-curtain"></div>
        <!-- === [STEP 2.1: UI SHELL & NAVIGATION] === -->
        <div id="brand-header">
            <img src="assets/BPCW-mainlogo.png" id="brand-logo" alt="Basti's Platinum Car Wash Logo">
            <div id="loading-progress">0%</div>
        </div>
        <div id="slogan-container">
            <div class="slogan-line">Premium care.</div>
            <div class="slogan-line">At your doorstep.</div>
            <div class="slogan-line">Every time.</div>
        </div>

        <nav id="main-menu">
            <button type="button" class="main-menu-btn" data-target="item1">About Us</button>
            <button type="button" class="main-menu-btn" data-target="item2">Our Services</button>
            <button type="button" class="main-menu-btn" data-target="item3">How It Works</button>
            <button type="button" class="main-menu-btn" data-target="item4">Contact & Hours</button>
        </nav>

        <a href="index.html" id="book-now-bubble" aria-label="Book Now"><span>Book Now</span></a>

        <!-- === [STEP 3.1: SELECTED-STATE UI SHELL] === -->
        <div id="content-display">
            <h2 id="content-title"></h2>
            <p id="content-body"></p>
        </div>

        <nav id="sub-menu">
            <button type="button" class="sub-menu-btn" data-target="home">Home</button>
            <button type="button" class="sub-menu-btn" data-target="item1">About Us</button>
            <button type="button" class="sub-menu-btn" data-target="item2">Our Services</button>
            <button type="button" class="sub-menu-btn" data-target="item3">How It Works</button>
            <button type="button" class="sub-menu-btn" data-target="item4">Contact & Hours</button>
        </nav>
    </div>

    <script type="module" src="home.js"></script>
</body>

</html>
